# DEFAULT
spring:
  profiles:
    active: dev
  mvc:
    servlet:
      path: /api/report/v1
    log-request-details: false
    log-resolved-exception: false
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    database: POSTGRESQL
    open-in-view: false
  # Keycloak OAuth2 Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DATAHUB_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${DATAHUB_KEYCLOAK_JWK_SET_URI}

server:
  port: 8084

s3:
  download-directory: "workingDirectory/"

management:
  endpoint:
    health:
      enabled: true
      show-details: never
    shutdown:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,shutdown

logging:
  level:
    root: warn
    ex.org.project.reportservice:
      ReportServiceApplication: info
    org.springframework.web.servlet:
      DispatcherServlet: trace
      mvc.method.annotation:
        HttpEntityMethodProcessor: trace

google-analytics:
  credentials: ${GACredentials}
  property-id: ${GA1PropertyId}
  user-analytics-fields:
    - activeUsers
    - screenPageViews
    - sessions

# Keycloak Configuration
keycloak:
  realm: ${DATAHUB_KEYCLOAK_REALM}
  resource: ${DATAHUB_KEYCLOAK_CLIENT_ID}

# RAS configuration - DEPRECATED (migrating to Keycloak)
# ras:
#   url: ${rasurl}
#   client:
#     id: ${rasclientid}
#     secret: ${rasclientsecret}

---
# LOCAL

spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/radx_local}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(REPORT)] [%boldGreen(LOCAL)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# DEV

spring:
  config:
    # import: aws-secretsmanager:application_dev
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  security:
    user:
      name: ${DATAHUB_SPRING_MANAGEMENT_USER}
      password: ${DATAHUB_SPRING_MANAGEMENT_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(REPORT)] [%boldGreen(DEV)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# TEST

spring:
  config:
    import: aws-secretsmanager:application_test
    activate:
      on-profile: test

logging:
  pattern:
    console: "[REPORT] [TEST] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# PROD

spring:
  config:
    import: aws-secretsmanager:application_prod
    activate:
      on-profile: prod

logging:
  pattern:
    console: "[REPORT] [PROD] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
