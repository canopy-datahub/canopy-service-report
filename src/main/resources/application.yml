# DEFAULT
spring:
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CANOPY_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${CANOPY_KEYCLOAK_JWK_SET_URI}
  mvc:
    log-request-details: false
    log-resolved-exception: false
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    database: POSTGRESQL
    open-in-view: false

server:
  port: 8084
  servlet:
    context-path: /api/report/v1

s3:
  download-directory: "workingDirectory/"

management:
  endpoint:
    health:
      enabled: true
      show-details: never
    shutdown:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,shutdown

logging:
  level:
    root: warn
    org.canopyplatform.canopy.reportservice:
      ReportServiceApplication: info
    org.springframework.web.servlet:
      DispatcherServlet: trace
      mvc.method.annotation:
        HttpEntityMethodProcessor: trace

google-analytics:
  credentials: ${GACredentials}
  property-id: ${GA1PropertyId}
  user-analytics-fields:
    - activeUsers
    - screenPageViews
    - sessions

---
# LOCAL

spring:
  jpa:
    show-sql: true
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${db_host:localhost}:${db_port:5432}/${db_name:canopy_local}
    username: ${db_username:canopy}
    password: ${db_password:canopy}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(REPORT)] [%boldGreen(LOCAL)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# DEV

spring:
  jpa:
    show-sql: true
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${host}:${port}/${dbname}
    username: ${dbuser}
    password: ${password}
  security:
    user:
      name: ${CANOPY_SPRING_MANAGEMENT_USER}
      password: ${CANOPY_SPRING_MANAGEMENT_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(REPORT)] [%boldGreen(DEV)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# TEST

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: test

logging:
  pattern:
    console: "[REPORT] [TEST] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# PROD

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: prod

logging:
  pattern:
    console: "[REPORT] [PROD] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
